<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ze-hud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="shape-square hud-hidden">

        <symbol id="i-crosshair" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="22" x2="18" y1="12" y2="12"/><line x1="6" x2="2" y1="12" y2="12"/><line x1="12" x2="12" y1="6" y2="2"/><line x1="12" x2="12" y1="22" y2="18"/></symbol>
        <symbol id="i-parachute" viewBox="0 0 24 24"><path d="M2.5 11C2.5 6.5 6.5 3 12 3s9.5 3.5 9.5 8c-1.6-1.4-3.2-1.4-4.75 0-1.6-1.4-3.1-1.4-4.75 0-1.6-1.4-3.1-1.4-4.75 0-1.55-1.4-3.15-1.4-4.75 0z"/><path d="M2.5 11 12 19M21.5 11 12 19M9.2 11.4 12 19M14.8 11.4 12 19"/><circle cx="12" cy="21" r="1"/></symbol>

        <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
        <symbol id="i-belt" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M6 21v-7a6 6 0 0 1 12 0v7"/><path d="m6 11 12 7"/></symbol>

        <symbol id="i-map" viewBox="0 0 24 24"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" x2="9" y1="3" y2="18"/><line x1="15" x2="15" y1="6" y2="21"/></symbol>
        <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></symbol>
        <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
        <symbol id="i-film" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M3 7.5h4M3 12h18M3 16.5h4M17 3v18M17 7.5h4M17 16.5h4"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>

<!-- ============================ HUD ============================ -->

<!-- Compass -->
<div id="compass" class="compass part" hidden>
    <div class="compass-pill glass">
        <div class="tape-mask"><div id="tape" class="tape"></div></div>
        <div id="compassPointer" class="compass-pointer"></div>
    </div>
    <div id="compassDeg" class="compass-deg">0&deg;</div>
    <div id="compassStreet" class="compass-street"><b id="street1"></b><span id="street2"></span></div>
    <div id="compassArea" class="compass-area"></div>
</div>

<!-- Money -->
<div id="money" class="money part"></div>

<!-- Minimap frame (drawn around the game's minimap) -->
<div id="frame" class="frame"><i></i><i></i><i></i><i></i></div>

<!-- Vitals -->
<div id="dock" class="dock part">
    <div id="flags" class="flags"></div>
    <div id="cells" class="cells"></div>
</div>

<!-- Vehicle -->
<div id="vehicle" class="vehicle part glass">
    <div class="gauge-wrap">
        <svg class="gauge" viewBox="0 0 200 200" aria-hidden="true">
            <path class="g-track" pathLength="100" d="M 40.6 159.4 A 84 84 0 1 1 159.4 159.4"/>
            <path id="gSpeed" class="g-fill" pathLength="100" d="M 40.6 159.4 A 84 84 0 1 1 159.4 159.4"/>
            <path class="g-rpm-track" pathLength="100" d="M 47.7 152.3 A 74 74 0 1 1 152.3 152.3"/>
            <path id="gRpm" class="g-rpm" pathLength="100" d="M 47.7 152.3 A 74 74 0 1 1 152.3 152.3"/>
        </svg>
        <div class="g-center">
            <div class="g-speed"><span id="speedGhost" class="ghost">00</span><span id="speedVal">0</span></div>
            <div id="speedUnit" class="g-unit">MPH</div>
        </div>
        <div id="gearBox" class="g-gear"><small>GEAR</small><span id="gear">N</span></div>
    </div>
    <div class="v-side">
        <div class="bars">
            <div id="barFuel" class="bar"><div class="bar-head"><svg class="icon"><use href="#i-fuel"/></svg><span>Fuel</span><b>0</b></div><div class="track"><i></i></div></div>
            <div id="barEngine" class="bar"><div class="bar-head"><svg class="icon"><use href="#i-wrench"/></svg><span>Engine</span><b>0</b></div><div class="track"><i></i></div></div>
            <div id="barNitro" class="bar"><div class="bar-head"><svg class="icon"><use href="#i-flame"/></svg><span>Nitro</span><b>0</b></div><div class="track"><i></i></div></div>
            <div id="barAlt" class="bar"><div class="bar-head"><svg class="icon"><use href="#i-mountain"/></svg><span id="altUnit">Alt</span><b>0</b></div></div>
        </div>
        <div class="chips">
            <div id="chipBelt" class="chip"><svg class="icon"><use href="#i-belt"/></svg><span>Belt</span></div>
            <div id="chipHarness" class="chip chip-harness"><svg class="icon"><use href="#i-shield-check"/></svg><span>Harness</span></div>
            <div id="chipCruise" class="chip chip-cruise"><svg class="icon"><use href="#i-gauge"/></svg><span>Cruise</span></div>
        </div>
    </div>
</div>

<!-- ============================ Menu ============================ -->

<div id="menu" class="menu" hidden>
    <div class="menu-panel">
        <aside class="menu-nav">
            <div class="brand"><span class="brand-mark">ZE</span><div><h1>HUD</h1><p>Settings</p></div></div>
            <nav id="tabs" class="tabs"></nav>
            <p class="menu-hint"><kbd>ESC</kbd> to close</p>
        </aside>
        <section class="menu-body">
            <header class="menu-head">
                <div><h2 id="tabTitle"></h2><p id="tabDesc"></p></div>
                <button id="menuClose" class="btn-icon" type="button" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
            </header>
            <div id="rows" class="rows"></div>
            <footer class="menu-foot">
                <button id="actCinematic" class="btn" type="button"><svg class="icon"><use href="#i-film"/></svg><span>Cinematic mode</span></button>
                <button id="actRestart" class="btn" type="button"><svg class="icon"><use href="#i-refresh"/></svg><span>Restart HUD</span></button>
                <button id="actReset" class="btn btn-danger" type="button"><svg class="icon"><use href="#i-reset"/></svg><span>Reset to defaults</span></button>
            </footer>
        </section>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
