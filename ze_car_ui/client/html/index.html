<html>
    <head>
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
        <link href="style.css" rel="stylesheet" type="text/css" />
    </head>
    <body>
		<div id="Car_Panel">
		
			
			
			
			<div id="Right_Back_Section" class="Section Right Top">
				<p>Back Right</p>
				<input id="Right_Back_Door" type="image" src="door.png" alt="Right Back Door" width="48" height="48">
				<input id="Right_Back_Window" type="image" src="window.png" alt="Right Back Window" width="48" height="48">
			</div>
			
			<div id="Left_Back_Section" class="Section Left Top">
				<p>Back Left</p>
				<input id="Left_Back_Door" type="image" src="door.png" alt="Left Back Door" width="48" height="48">
				<input id="Left_Back_Window" type="image" src="window.png" alt="Left Back Window" width="48" height="48">
			</div>
			
			<div id="Right_Front_Section" class="Section Right">
				<p>Front Right</p>
				<input id="Right_Front_Door" type="image" src="door.png" alt="Right Front Door" width="48" height="48">
				<input id="Right_Front_Window" type="image" src="window.png" alt="Right Front Window" width="48" height="48">
			</div>
			
			<div id="Left_Front_Section" class="Section Left">
				<p>Front Left</p>
				<input id="Left_Front_Door" type="image" src="door.png" alt="Left Front Door" width="48" height="48">
				<input id="Left_Front_Window" type="image" src="window.png" alt="Left Front Window" width="48" height="48">			
			</div>
			
			<div id = "Utilities">
				<button id="Trunk_Door" class="ut_button">Trunk</button>
				<button id="Hood_Door" class="ut_button">Hood</button>
				<button id="Engine" class="ut_button">Engine</button>
				<button id="Neon" class="ut_button">Neon</button>
			</div>
			
		</div>

        <script src="script.js" type="text/javascript"></script>
    </body>
</html>
